<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Shop — Hyperlocal Campus Marketplace & Student Life Hub</title>
  <meta name="description" content="Hyperlocal OLX-style classifieds platform for Indian engineering colleges. Buy, sell, rent books, calci, drafters, cycles, find roommates & peer services.">

  <!-- Google Fonts: Fraunces & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..900;1,9..144,600..900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            inkTeal: '#102A27',
            paperBg: '#F4F1EA',
            surfaceCard: '#FFFDF8',
            pineAccent: '#3D7A6E',
            mutedText: '#5C6B68',
            warmBorder: '#E2DDD3',
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            display: ['Fraunces', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- ESM Import Map for React 18 -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      background-color: #F4F1EA;
      color: #102A27;
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Main ES Module Entrypoint -->
  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { App } from './src/App.js';

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(React.createElement(App));
  </script>
</body>
</html>
